<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141518"/>
      <stop offset="50%" stop-color="#0c0d0f"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b2b"/>
      <stop offset="50%" stop-color="#f25a18"/>
      <stop offset="100%" stop-color="#d6450f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b2b" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#2a241e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff7b2b" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="105" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Accent Ring -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>

  <!-- Sparkling 4-point Diamond Star Emblem -->
  <path d="M 256 70 Q 256 120 285 120 Q 256 120 256 170 Q 256 120 227 120 Q 256 120 256 70 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="120" r="8" fill="#fff5ec"/>

  <!-- Bold Monogram "LR" -->
  <g font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="325" font-size="160" fill="#ff6b24" opacity="0.3" filter="url(#glow)">LR</text>
    <text x="256" y="320" font-size="160" fill="#ffffff">LR</text>
  </g>

  <!-- Pill Badge with "OWNER" -->
  <rect x="146" y="375" width="220" height="52" rx="26" fill="url(#orangeGrad)"/>
  <text x="256" y="409" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="4">O W N E R</text>
</svg>
